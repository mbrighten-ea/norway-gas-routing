[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "norway-gas-routing"
version = "0.1.0"
description = "Monthly Norwegian pipeline gas routing model foundation"
requires-python = ">=3.10"
dependencies = ["pandas", "PyYAML", "pyarrow"]

[project.optional-dependencies]
poc = ["pulp>=4.0", "networkx", "matplotlib", "openpyxl"]
reporting = ["matplotlib", "openpyxl", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
